const map=L.map('map',{crs:L.CRS.Simple,minZoom:-2,maxZoom:4,zoomSnap:.25}); const bounds=[[-235,-235],[225,235]]; map.fitBounds(bounds); L.rectangle(bounds,{color:'#334155',weight:1,fillOpacity:.05}).addTo(map);
function popup(p){return '<b>'+p.name+'</b><br>'+Object.entries(p).filter(([k,v])=>k!='id'&&v).map(([k,v])=>'<b>'+k.replaceAll('_',' ')+'</b>: '+v).join('<br>')}
function regionStyle(f){return {color:f.properties.region_color,fillColor:f.properties.region_color,fillOpacity:f.properties.name=='Nullshade'?.42:.23,weight:f.properties.name=='Nullshade'?3:2}}
function pointStyle(f,ll){let t=f.properties.feature_type, fill='#fde68a', r=6;if(t=='NPC'){fill='#22c55e';r=5} if(t=='Enemy'){fill='#ef4444';r=5} if(t=='Boss'){fill='#991b1b';r=7} if(t=='Faction'){fill='#0ea5e9';r=6} if(['hub','main_site'].includes(t)){fill='#facc15';r=9} return L.circleMarker(ll,{radius:r,color:'#111827',weight:1,fillColor:fill,fillOpacity:.9})}
function linkStyle(f){let t=f.properties.feature_type; let s={contains:['#64748b',.25,1,''],prism_gate_route:['#06b6d4',.75,2,'6 4'],hosts_npc:['#16a34a',.28,1,''],hosts_enemy:['#dc2626',.28,1,''],hosts_boss:['#991b1b',.45,1.5,''],hosts_faction:['#0284c7',.28,1,''],counter:['#db2777',.75,2,'4 4'],conceptual:['#6b7280',.6,1.5,'2 6'],variant:['#7c3aed',.75,2,'8 4'],intrusion:['#111827',.65,2,'3 5'],inversion:['#f97316',.75,2,'5 5'],history:['#a16207',.75,2,'7 4'],secret:['#000',.7,2,'1 5']}[t]||['#64748b',.35,1,'']; return {color:s[0],opacity:s[1],weight:s[2],dashArray:s[3]}}
function gj(data,opt){return L.geoJSON(data,{coordsToLatLng:c=>L.latLng(c[1],c[0]),...opt})}
const R=gj(regions,{style:regionStyle,onEachFeature:(f,l)=>{l.bindPopup(popup(f.properties));l.bindTooltip(f.properties.name,{permanent:true,direction:'center',className:'region-label'})}}).addTo(map);
const Lks=gj(links,{style:linkStyle,onEachFeature:(f,l)=>l.bindPopup(popup(f.properties))});
const Lm=gj(landmarks,{pointToLayer:pointStyle,onEachFeature:(f,l)=>l.bindPopup(popup(f.properties))}).addTo(map);
const N=gj({type:'FeatureCollection',features:entities.features.filter(f=>f.properties.feature_type=='NPC')},{pointToLayer:pointStyle,onEachFeature:(f,l)=>l.bindPopup(popup(f.properties))}).addTo(map);
const E=gj({type:'FeatureCollection',features:entities.features.filter(f=>['Enemy','Boss'].includes(f.properties.feature_type))},{pointToLayer:pointStyle,onEachFeature:(f,l)=>l.bindPopup(popup(f.properties))}).addTo(map);
const F=gj({type:'FeatureCollection',features:entities.features.filter(f=>f.properties.feature_type=='Faction')},{pointToLayer:pointStyle,onEachFeature:(f,l)=>l.bindPopup(popup(f.properties))});
L.control.layers(null,{Regions:R,Landmarks:Lm,NPCs:N,'Enemies & Bosses':E,Factions:F,'Relationship Lines':Lks},{collapsed:false}).addTo(map);
let leg=L.control({position:'bottomright'});leg.onAdd=()=>{let d=L.DomUtil.create('div','legend');d.innerHTML='<b>Game World GIS Map</b><br><span class="sw" style="background:#facc15"></span>Landmark / hub<br><span class="sw" style="background:#22c55e"></span>NPC<br><span class="sw" style="background:#ef4444"></span>Enemy<br><span class="sw" style="background:#991b1b"></span>Boss<br><span class="sw" style="background:#0ea5e9"></span>Faction<br><hr>Toggle layers in the top-right.<br>Coordinates are fictional CRS.Simple units.';return d};leg.addTo(map);
